{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis-subchart
  labels:
    app: {{ .Release.Name }}-redis-subchart
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 6379
    protocol: TCP
  selector:
    app: {{ .Release.Name }}-redis-subchart
{{- end }}
