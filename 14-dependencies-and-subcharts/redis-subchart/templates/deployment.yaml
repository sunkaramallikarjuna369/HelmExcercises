{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis-subchart
  labels:
    app: {{ .Release.Name }}-redis-subchart
    {{- if .Values.global }}
    environment: {{ .Values.global.environment }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis-subchart
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis-subchart
    spec:
      containers:
      - name: redis
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 6379
{{- end }}
