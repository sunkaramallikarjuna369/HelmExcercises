replicaCount: 1

image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent

config:
  appName: "MyApplication"
  logLevel: "info"
  database:
    host: "db.example.com"
    port: "5432"
    name: "mydb"
  features:
    enableCache: true
    enableMetrics: true

secrets:
  databasePassword: "changeme"
  apiKey: "demo-api-key-12345"
  jwtSecret: "demo-jwt-secret"

configFiles:
  app.conf: |
    server {
      listen 80;
      server_name localhost;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
  
  logging.conf: |
    [loggers]
    keys=root
    
    [handlers]
    keys=console
    
    [formatters]
    keys=simple
    
    [logger_root]
    level=INFO
    handlers=console
