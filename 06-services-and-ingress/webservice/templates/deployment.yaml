apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webservice
  labels:
    app: {{ .Release.Name }}-webservice
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-webservice
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-webservice
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
