apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-funcapp-config
  labels:
    app: {{ .Release.Name }}-funcapp
data:
  app.conf: |
    # Application Configuration
    app_name: {{ .Release.Name | quote }}
    namespace: {{ .Release.Namespace | quote }}
    
    # Database Configuration
    database:
      host: {{ .Values.config.database.host | quote }}
      port: {{ .Values.config.database.port }}
      name: {{ .Values.config.database.name | quote }}
    
    # Features
    features:
    {{- range .Values.config.features }}
      - {{ . | quote }}
    {{- end }}
    
    # Settings
    settings:
      timeout: {{ .Values.config.settings.timeout }}
      retries: {{ .Values.config.settings.retries }}
  
  labels.json: |
    {{- .Values.labels | toJson | nindent 4 }}
  
  labels.yaml: |
    {{- .Values.labels | toYaml | nindent 4 }}
