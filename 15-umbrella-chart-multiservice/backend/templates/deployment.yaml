{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
    tier: backend
    {{- if .Values.global }}
    environment: {{ .Values.global.environment }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://{{ .Release.Name }}-database:5432/mydb"
        {{- if .Values.global }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | quote }}
        {{- end }}
{{- end }}
