apiVersion: v2
name: umbrella
description: An umbrella chart for deploying a multi-service application
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: frontend
    version: "0.1.0"
    repository: "file://../frontend"
    condition: frontend.enabled
  - name: backend
    version: "0.1.0"
    repository: "file://../backend"
    condition: backend.enabled
  - name: database
    version: "0.1.0"
    repository: "file://../database"
    condition: database.enabled
